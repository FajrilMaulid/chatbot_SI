<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Head -->
  <rect x="16" y="20" width="32" height="28" rx="4" fill="#667eea" stroke="#764ba2" stroke-width="2"/>
  
  <!-- Antenna -->
  <line x1="32" y1="20" x2="32" y2="12" stroke="#764ba2" stroke-width="2" stroke-linecap="round"/>
  <circle cx="32" cy="12" r="3" fill="#ff6b9d"/>
  
  <!-- Eyes -->
  <circle cx="24" cy="30" r="3" fill="#fff"/>
  <circle cx="40" cy="30" r="3" fill="#fff"/>
  <circle cx="24" cy="30" r="1.5" fill="#000"/>
  <circle cx="40" cy="30" r="1.5" fill="#000"/>
  
  <!-- Mouth -->
  <line x1="24" y1="40" x2="40" y2="40" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Ears -->
  <rect x="12" y="28" width="4" height="8" rx="2" fill="#667eea" stroke="#764ba2" stroke-width="1"/>
  <rect x="48" y="28" width="4" height="8" rx="2" fill="#667eea" stroke="#764ba2" stroke-width="1"/>
</svg>
